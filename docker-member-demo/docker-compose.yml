services:
  db:
    image: postgres:16-alpine
    container_name: member-demo-db
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: member_demo
    ports:
      - "5432:5432"
    volumes:
      - member_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d member_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: member-demo-backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://appuser:apppass@db:5432/member_demo
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: member-demo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  member_demo_data:

